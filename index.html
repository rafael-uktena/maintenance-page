<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uktena - Service Unavailable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .logo {
            height: 120px;
            width: auto;
            margin-bottom: 2rem;
            opacity: 0.95;
            max-width: 300px;
        }

        .maintenance-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
            animation: pulse 2s infinite;
        }

        .title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 1rem;
            opacity: 0.95;
        }

        .message {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 2rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                margin: 2rem;
                padding: 2rem 1.5rem;
            }

            .logo {
                height: 60px;
                max-width: 150px;
            }

            .title {
                font-size: 1.6rem;
            }

            .message {
                font-size: 1rem;
            }

            .maintenance-icon {
                font-size: 3rem;
            }
        }

        /* Background decoration */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>') center/cover;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.png" alt="Uktena" class="logo" />
        
        <div class="maintenance-icon">🔧</div>
        
        <h1 class="title">Service unavailable</h1>
        
        <p class="message">
            Our service is currently not available.
        </p>
        
       </div>
</body>
</html>
